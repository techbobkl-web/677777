name: Build Roblox Farm

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish RobloxFarm.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/publish/RobloxFarm.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Roblox Farm.app and zip it
        working-directory: mac
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/dist/RobloxFarm-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            out/windows/RobloxFarm.exe \
            out/mac/RobloxFarm-mac.zip \
            --title "Roblox Farm ${{ github.ref_name }}" \
            --notes "Roblox Farm. Press Shift+1 to stop it."
