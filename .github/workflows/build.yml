name: Build 677777

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish SixSeven.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: windows/publish/677777.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build 677777.app and zip it
        working-directory: mac
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/dist/677777-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ github.ref_name }}" \
            out/windows/677777.exe \
            out/mac/677777-mac.zip \
            --title "677777 ${{ github.ref_name }}" \
            --notes "A harmless 677777 popup prank. Windows: run 677777.exe. Mac: unzip 677777-mac.zip, then right-click the app and choose Open (it isn't notarized). Press Shift+1 to stop it. Run it on your own machine, or on a friend's with them there."
